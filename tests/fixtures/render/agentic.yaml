version: 2
project: demo
tools:
  java: {versions: [17, 11], default: 17}
  terraform: "1.9.8"
  apt: [tree, graphviz]
docker:
  socket: true
setup:
  - add plugin r@m
  - copy files/settings.xml /home/dev/.m2/settings.xml
  - copy files/corp.crt /usr/local/share/ca-certificates/corp.crt
  - add mcp x --env TOKEN -- run-x 'a b'
  - mount ~/.aws /home/dev/.aws --readonly
  - volume m2 /home/dev/.m2
