version: 2
project: smoke-project
layout: single
base_image: agentic-smoke-overlay:local
tools:
  java: {versions: [17, 8], default: 17}
  terraform: "1.5.7"
  hello: "1.0"
  apt: [tree]
setup:
  - copy files/smoke-ca.crt /usr/local/share/ca-certificates/smoke-ca.crt
  - copy files/marketplace /opt/smoke-marketplace
  - add marketplace /opt/smoke-marketplace
  - add plugin hello@smoke-marketplace
  - add mcp fake --env SMOKE_TOKEN -- true
  - add agent agents/db.md --target claude
  - volume m2 /home/dev/.m2
