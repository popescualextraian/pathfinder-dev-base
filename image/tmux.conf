# tmux for agentic dev sessions (dev-shell attaches the session "main").
set -g history-limit 50000
# Copy from tmux reaches the system clipboard through OSC 52 where the terminal supports it.
set -g set-clipboard on
# Mouse stays off: the terminal keeps its own selection and right-click paste. To scroll with the
# wheel instead, add "set -g mouse on" to ~/.tmux.conf (then hold Shift to select or paste).
